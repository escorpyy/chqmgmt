<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Cheque Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    padding: 2rem;
    border: 1px solid var(--border, #ddd);
    border-radius: 8px;
  }
  .login-card h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
  .login-card p.hint { margin-top: 0; }
  .login-card .field { margin-bottom: 1rem; }
  .login-card .field label { display: block; margin-bottom: 0.25rem; }
  .login-card .field input {
    width: 100%;
    box-sizing: border-box;
  }
  .login-card .btn-primary { width: 100%; margin-top: 0.5rem; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>Cheque Register</h1>
    <p class="hint">Sign in to continue</p>
    <form id="login-form">
      <div class="form-error"></div>
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
